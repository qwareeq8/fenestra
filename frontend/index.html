<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fenestra</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "WebCM Sans 10", "CMU Sans Serif", "Segoe UI", system-ui, sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid var(--fenestra-focus, #e2a54a);
        outline-offset: 2px;
      }

      * {
        scrollbar-color: var(--fenestra-scrollbar-thumb, #3a414e)
          var(--fenestra-scrollbar-track, transparent);
        scrollbar-width: thin;
      }

      *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      *::-webkit-scrollbar-track {
        background: var(--fenestra-scrollbar-track, transparent);
      }

      *::-webkit-scrollbar-thumb {
        background: var(--fenestra-scrollbar-thumb, #3a414e);
        border: 2px solid var(--fenestra-scrollbar-track, transparent);
        border-radius: 999px;
      }

      /* The stepper input is only as wide as its digits, so the whole
         field shows its focus ring. */
      .fenestra-stepper-input:focus-visible {
        outline: none;
      }

      .fenestra-stepper-field:has(.fenestra-stepper-input:focus-visible) {
        outline: 2px solid var(--fenestra-focus, #e2a54a);
        outline-offset: -2px;
      }

      .fenestra-stepper-input::-webkit-inner-spin-button,
      .fenestra-stepper-input::-webkit-outer-spin-button {
        margin: 0;
        appearance: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
